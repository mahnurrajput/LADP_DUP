experiment: ladp_llava_vizwiz_stage1_pilot_mlp3_small

# FYP-1 PILOT g_phi.  Reproduces the run trained on 14 Nov 2026 (epochs 1-7, then
# resumed from epoch 8): mlp3_small (4096->2048->2048->1024, 14,685,184 params),
# Adam, constant lr, no grad clipping, summed MSE, patience 5, min_delta 0.
# Its outputs are kept in checkpoints/recon_pilot/ and results/pilot_mlp3_small/.
# Use this config for the FYP-1 Stage-1 diagnostic.  Retraining with it would
# overwrite those pilot files, so copy them first.

model:
  name: llava-hf/llava-1.5-7b-hf
  precision: fp16
  device: cuda

clip:
  name: ViT-L-14-336
  pretrained: openai

data:
  coco_train_images: data/coco/train2017
  vizwiz_images:     data/vizwiz/val
  vizwiz_questions:  data/vizwiz/val.json
  cache_dir:         data/cache
  max_images:        10000    # the pilot's 10,000 images (9,500 train / 500 val). Was null (= all
  subset_mode:       first    # cached); pinned so the pilot stays on these images once the full
                              # cache exists. Same files and seed, so the split is unchanged.
  vizwiz_tuning_n:   1000
  vizwiz_heldout_start: 3800

loss:
  reconstructor: mlp3_small  # "mlp3" in the pilot's config_snapshot.yaml (alias)
  expected_params: 14685184
  distance: mse
  norm: robust
  hidden_dim: 2048
  dropout: 0.1

relevance:
  scorer: clip_cosine
  norm: minmax
  centring: false

priority:
  mode: additive
  alpha: 0.5
  beta: 0.5

training:
  run_name: recon_pilot
  epochs: 30
  lr: 1.0e-4
  batch_size: 128            # patches
  optimizer: adam
  scheduler: none
  grad_clip: null
  loss_reduction: sum
  patience: 5
  min_delta: 0.0
  seed: 42
  num_workers: 4
  val_fraction: 0.05
  files_per_shard: 64

strategy:
  name: hard_threshold
  top_k: 144

checkpoints_dir: checkpoints
output_dir: results/pilot_mlp3_small/
